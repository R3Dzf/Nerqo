name: Native Android UI smoke
on:
  push:
    branches: [dev/native-5ghz-20261016]
    paths:
      - 'android/**'
      - 'tools/qa/android_ui.py'
      - 'tools/qa/android_transfer_server.py'
      - '.github/workflows/native-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nerqo-android-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - name: Compile native UI
        working-directory: android
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Start disposable TLS peer
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/nerqo-fixture.key -out /tmp/nerqo-fixture.crt -days 1 -subj /CN=localhost
          python tools/qa/android_transfer_server.py --cert /tmp/nerqo-fixture.crt --key /tmp/nerqo-fixture.key > /tmp/nerqo-fixture.log 2>&1 &
          echo "NERQO_FIXTURE_FP=$(openssl x509 -in /tmp/nerqo-fixture.crt -outform DER | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_ENV"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise Compose on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p ui-smoke-android
            adb logcat -c
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e fingerprint $NERQO_FIXTURE_FP com.r3dzf.nerqo.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/nerqo-instrumentation.txt
            adb logcat -d -s AndroidRuntime:E > ui-smoke-android/runtime.txt
            grep -q 'OK (5 tests)' /tmp/nerqo-instrumentation.txt
            python tools/qa/android_ui.py
      - name: Collect emulator diagnostics
        if: always()
        run: |
          mkdir -p ui-smoke-android
          cp /tmp/nerqo-instrumentation.txt ui-smoke-android/instrumentation.txt 2>/dev/null || true
          cp /tmp/nerqo-fixture.log ui-smoke-android/fixture.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nerqo-Android-UI
          path: ui-smoke-android/**
          if-no-files-found: warn
