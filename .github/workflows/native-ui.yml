name: Native Android UI smoke
on:
  push:
    branches: [dev/native-5ghz-20261016]
    paths:
      - 'android/**'
      - 'tools/qa/android_ui.py'
      - '.github/workflows/native-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nerqo-android-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile native UI
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise Compose on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            python tools/qa/android_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nerqo-Android-UI
          path: ui-smoke-android/*.png
          if-no-files-found: warn
