name: Nerqo native Windows and Android CI
on:
  workflow_dispatch:
  push:
    branches:
      - dev/native-5ghz-20261016
    paths:
      - 'desktop/**'
      - 'android/**'
      - 'installer/**'
      - 'assets/**'
      - 'nerqo/**'
      - 'web/**'
      - 'app.py'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'desktop/**'
      - 'android/**'
      - '.github/workflows/native-preview.yml'
concurrency:
  group: nerqo-native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Compile native WPF app
        run: dotnet publish desktop/Nerqo.Desktop/Nerqo.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=false -o dist/Windows
      - name: Capture actual WPF screens
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "$pwd/dist/Windows/Nerqo.exe" -ArgumentList '--ui-smoke' -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'UI smoke timed out' }
          if ($app.ExitCode -ne 0) { throw "UI smoke exit: $($app.ExitCode)" }
          foreach ($screen in @('Transfers', 'Devices', 'Settings', 'Transfers-dark', 'Settings-dark')) {
            if (-not (Test-Path "ui-smoke/$screen.png")) { throw "Missing UI screenshot: $screen" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Nerqo-Windows-UI
          path: ui-smoke/**
      - name: Execute native LAN transport smoke test
        run: dotnet run --project desktop/Nerqo.HostSmoke/Nerqo.HostSmoke.csproj -c Release
      - name: Verify private-only native Firewall permissions
        shell: pwsh
        run: |
          $test = Start-Process -FilePath "$pwd/dist/Windows/Nerqo.exe" -ArgumentList '--firewall-smoke' -Wait -PassThru
          if ($test.ExitCode -ne 0) {
            if (Test-Path dist/qa/windows-firewall-error.txt) { Get-Content dist/qa/windows-firewall-error.txt }
            throw 'Native Firewall permission verification failed'
          }
          Get-Content dist/qa/windows-firewall.txt
      - name: Build normal Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/Nerqo.iss
      - name: Build previous native installer and verify in-place upgrade
        shell: pwsh
        run: |
          git fetch --depth 1 origin 84ef1449cf0bbfc0090b8828123f83d747540b64
          git worktree add --detach previous-native 84ef1449cf0bbfc0090b8828123f83d747540b64
          dotnet publish previous-native/desktop/Nerqo.Desktop/Nerqo.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=false -o previous-native/dist/Windows
          if ($LASTEXITCODE -ne 0) { throw 'Previous native publish failed' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" previous-native/installer/Nerqo.iss
          if ($LASTEXITCODE -ne 0) { throw 'Previous native installer failed' }
          ./tools/qa/windows_upgrade.ps1 -OldInstaller previous-native/dist/Installer/Nerqo-Windows-Setup.exe -NewInstaller dist/Installer/Nerqo-Windows-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native upgrade verification failed' }
          python tools/qa/windows_delta_budget.py --baseline-source previous-native/dist/Windows --target dist/Installer/Nerqo-Windows-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Installer delta budget verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Nerqo-Windows-Upgrade-Verification
          path: dist/qa/windows-upgrade.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Nerqo-Native-Windows-Setup-Preview
          path: dist/Installer/Nerqo-Windows-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Nerqo-Native-Windows-Portable-Preview
          path: dist/Windows/**
  android-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run legacy regression + native source tests
        run: python -m unittest discover -s tests -q
      - name: Compile Compose debug APK
        working-directory: android
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Compile unsigned native release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Nerqo-Native-Android-Unsigned-Preview
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nerqo-Native-Android-Debug-Preview
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Export SDK signer for private release signing
        run: |
          mkdir -p dist/SigningTool
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" dist/SigningTool/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Nerqo-Android-Signing-Tool
          path: dist/SigningTool/apksigner.jar
