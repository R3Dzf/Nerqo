name: Build and publish Nerqo native Stable
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Stable release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nerqo-stable-release
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v$(grep -m1 'versionName =' android/app/build.gradle.kts | cut -d '"' -f2)"
          [[ "$TAG" =~ ^v[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]
          [ -z "$REQUESTED_VERSION" ] || [ "$REQUESTED_VERSION" = "$TAG" ]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  android-ui:
    uses: ./.github/workflows/native-ui.yml

  windows-native:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build native WPF (not the legacy Python UI)
        run: dotnet publish desktop/Nerqo.Desktop/Nerqo.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=false -o dist/Windows
      - name: Capture actual WPF screens
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "$pwd/dist/Windows/Nerqo.exe" -ArgumentList '--ui-smoke' -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'UI smoke timed out' }
          if ($app.ExitCode -ne 0) { throw "UI smoke exit: $($app.ExitCode)" }
          foreach ($screen in @('Transfers', 'History', 'Devices', 'Settings', 'Transfers-dark', 'Settings-dark')) {
            if (-not (Test-Path "ui-smoke/$screen.png")) { throw "Missing UI screenshot: $screen" }
          }
      - name: Test encrypted LAN transport, resumable files and folder recovery
        run: dotnet run --project desktop/Nerqo.HostSmoke/Nerqo.HostSmoke.csproj -c Release
      - name: Verify private-only native Firewall permissions
        shell: pwsh
        run: |
          $test = Start-Process -FilePath "$pwd/dist/Windows/Nerqo.exe" -ArgumentList '--firewall-smoke' -Wait -PassThru
          if ($test.ExitCode -ne 0) {
            if (Test-Path dist/qa/windows-firewall-error.txt) { Get-Content dist/qa/windows-firewall-error.txt }
            throw 'Native Firewall permission verification failed'
          }
          Get-Content dist/qa/windows-firewall.txt
      - name: Build Windows setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/Nerqo.iss
          New-Item -ItemType Directory -Force dist/StableWindows
          Copy-Item dist/Installer/Nerqo-Windows-Setup.exe dist/StableWindows/Nerqo-Windows-Setup.exe
      - name: Build previous native installer and verify in-place upgrade
        timeout-minutes: 5
        shell: pwsh
        run: |
          git fetch --depth 1 origin 7675ce136be4f5c6d6bca51ab2e982ba530a811d
          git worktree add --detach previous-native 7675ce136be4f5c6d6bca51ab2e982ba530a811d
          dotnet publish previous-native/desktop/Nerqo.Desktop/Nerqo.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=false -o previous-native/dist/Windows
          if ($LASTEXITCODE -ne 0) { throw 'Previous native publish failed' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" previous-native/installer/Nerqo.iss
          if ($LASTEXITCODE -ne 0) { throw 'Previous native installer failed' }
          ./tools/qa/windows_upgrade.ps1 -OldInstaller previous-native/dist/Installer/Nerqo-Windows-Setup.exe -NewInstaller dist/Installer/Nerqo-Windows-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native upgrade verification failed' }
          python tools/qa/windows_delta_budget.py --baseline-source previous-native/dist/Windows --baseline-version 1.0.8 --target dist/Installer/Nerqo-Windows-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Installer delta budget verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: stable-windows-verification
          path: dist/qa/windows-*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: stable-windows-setup
          path: dist/StableWindows/Nerqo-Windows-Setup.exe
          if-no-files-found: error

  android-signed-verification:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run regressions
        run: python -m unittest discover -s tests -q
      - name: Test Android recovery and compile native release (unsigned)
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Verify private-release-signed APK against reproducible payload
        env:
          RELEASE_TAG: ${{ inputs.version || needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          APK="downloads/Nerqo-Android-v${VERSION}.apk"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$APK" ] && [ -d "downloads/signed-v${VERSION}" ]; then
            cat "downloads/signed-v${VERSION}"/android.apk.part[0-9][0-9][0-9] > "$APK"
          fi
          test -f "$APK" || (echo 'Signed Android APK missing. Sign privately first; never commit the signing key.'; exit 1)
          test -f "$UNSIGNED"
          (cd downloads && sha256sum --check --status "Nerqo-Android-v${VERSION}.apk.sha256")
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(tr -d '[:space:]' < android/RELEASE_SIGNING_CERT.sha256)
          test "$ACTUAL" = "$EXPECTED" || (echo 'Incorrect permanent Android signing identity'; exit 1)
          python tools/verify_published_apk.py "$UNSIGNED" "$APK"
          mkdir -p dist/StableAndroid
          cp "$APK" dist/StableAndroid/Nerqo-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: stable-android-signed
          path: dist/StableAndroid/Nerqo-Android.apk
          if-no-files-found: error

  publish:
    # Never create a Stable release from a development/preview branch.
    if: github.ref == 'refs/heads/main'
    needs: [version, windows-native, android-signed-verification, android-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: stable-windows-setup
          path: staging/windows
      - uses: actions/download-artifact@v4
        with:
          name: stable-android-signed
          path: staging/android
      - name: Validate versions and compile update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version || needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]] || (echo 'Only 1.0.0+ stable versions can be published'; exit 1)
          VERSION="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it'
            exit 1
          fi
          mkdir -p staging/release staging/previous
          PREV=$(gh release list --json tagName --limit 1 --jq '.[0].tagName' || true)
          OLDARGS=()
          if [[ "$PREV" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            gh release download "$PREV" --pattern 'Nerqo-Windows-Setup.exe' --dir staging/previous || true
            gh release download "$PREV" --pattern 'Nerqo-Android.apk' --dir staging/previous || true
            OLDARGS+=(--old-version "${PREV#v}")
            if [ -f staging/previous/Nerqo-Windows-Setup.exe ]; then OLDARGS+=(--old-windows staging/previous/Nerqo-Windows-Setup.exe); fi
            if [ -f staging/previous/Nerqo-Android.apk ]; then OLDARGS+=(--old-android staging/previous/Nerqo-Android.apk); fi
          fi
          python tools/build_native_release.py --version "$VERSION" \
            --windows staging/windows/Nerqo-Windows-Setup.exe \
            --android staging/android/Nerqo-Android.apk \
            --output staging/release "${OLDARGS[@]}"
      - name: Publish full installers and compatible deltas
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version || needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          (cd staging/release && sha256sum Nerqo-* update-manifest.json > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" staging/release/* --target "$GITHUB_SHA" --title "Nerqo $RELEASE_TAG Stable" --notes-file "docs/releases/${RELEASE_TAG}.md" --latest
