name: Publish signed updates for Windows and Android
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag of the signed release, e.g. v0.3.0'
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m unittest discover -s tests -v
      - run: |
          python -m pip install pyinstaller==6.16.0
          pyinstaller --noconfirm --onefile --name Nerqo --add-data "web;web" --add-data "nerqo/replace_windows.ps1;nerqo" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/Nerqo.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Configure stable signing key
        env:
          STORE_BASE64: ${{ secrets.NERQO_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NERQO_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NERQO_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NERQO_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || (echo 'Stable Android signing secrets are required for release' && exit 1)
          printf '%s' "$STORE_BASE64" | base64 -d > "$RUNNER_TEMP/nerqo-release.jks"
          echo "NERQO_SIGNING_FILE=$RUNNER_TEMP/nerqo-release.jks" >> "$GITHUB_ENV"
          echo "NERQO_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NERQO_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NERQO_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Confirm permanent Android signing identity
        run: |
          set -euo pipefail
          ACTUAL=$(keytool -list -v -keystore "$NERQO_SIGNING_FILE" -storepass "$NERQO_STORE_PASSWORD" -alias "$NERQO_KEY_ALIAS" | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(tr -d '\n\r ' < android/RELEASE_SIGNING_CERT.sha256)
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo 'Signing identity does not match the pinned Nerqo Android certificate.'
            exit 1
          fi
      - name: Build signed APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify signed Android APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL" = "$(cat android/RELEASE_SIGNING_CERT.sha256)" || (echo 'Built APK certificate mismatch' && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: android/app/build/outputs/apk/release/*.apk
  publish:
    needs: [windows,android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@v4
        with: {name: release-windows, path: staging/windows}
      - uses: actions/download-artifact@v4
        with: {name: release-android, path: staging/android}
      - name: Collect previous release and prepare deltas
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          python - <<'PY'
          from nerqo.version import VERSION
          import os
          assert os.environ['TAG'] == 'v'+VERSION, 'Tag and app versions must match'
          PY
          mkdir -p previous
          PREV=$(gh release list --json tagName --limit 1 --jq '.[0].tagName' || true)
          if [ -n "$PREV" ]; then
            gh release download "$PREV" --pattern 'Nerqo-Windows.exe' --dir previous || true
            gh release download "$PREV" --pattern 'Nerqo-Android.apk' --dir previous || true
          fi
          OLDARGS=()
          if [ -n "$PREV" ]; then
            OLDARGS+=(--old-version "${PREV#v}")
            if [ -f previous/Nerqo-Windows.exe ]; then OLDARGS+=(--old-windows previous/Nerqo-Windows.exe); fi
            if [ -f previous/Nerqo-Android.apk ]; then OLDARGS+=(--old-android previous/Nerqo-Android.apk); fi
          fi
          python tools/build_release.py --version "${TAG#v}" --windows staging/windows/Nerqo.exe \
            --android staging/android/app-release.apk --target staging/release "${OLDARGS[@]}"
      - name: Publish full and delta assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: gh release create "$TAG" staging/release/* --target "$GITHUB_SHA" --title "Nerqo $TAG" --generate-notes
